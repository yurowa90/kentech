# GPT 교차 검토 통로: .github/gpt/ask.md 를 이 브랜치에 올리면 GitHub Models(OpenAI 모델)에 물어보고
# 답을 작업 로그(===ANSWER=== 사이)와 실행 요약, 산출물(answer.md)로 남긴다.
# OpenAI 키 없이 저장소의 GITHUB_TOKEN(models: read 권한)만 쓴다.
name: gpt-bridge
on:
  push:
    branches: [claude/gpt-bridge]
    paths: [".github/gpt/ask.md"]
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ask GPT
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          raw = open(".github/gpt/ask.md", encoding="utf-8").read()
          # 첫 줄 "model: openai/gpt-4.1" 처럼 모델을 고를 수 있다(없으면 차례로 시도).
          m = re.match(r"model:\s*(\S+)\s*\n", raw)
          models = [m.group(1)] if m else ["openai/gpt-5", "openai/gpt-4.1", "openai/gpt-4o"]
          prompt = raw[m.end():] if m else raw
          sysmsg = "당신은 교육용 게임 설계와 경제 모형을 비판적으로 검토하는 검토자다. 한국어로, 근거를 들어, 구체적인 수정안을 번호로 제시하라."
          ans, used, errs = None, None, []
          for model in models:
              body = json.dumps({"model": model, "messages": [{"role": "system", "content": sysmsg}, {"role": "user", "content": prompt}]}).encode()
              req = urllib.request.Request("https://models.github.ai/inference/chat/completions", data=body, headers={"Authorization": "Bearer " + os.environ["GH_MODELS_TOKEN"], "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=240) as r:
                      ans = json.load(r)["choices"][0]["message"]["content"]; used = model; break
              except urllib.error.HTTPError as e:
                  errs.append(f"{model}: HTTP {e.code} {e.read()[:300]!r}")
              except Exception as e:
                  errs.append(f"{model}: {e}")
          out = f"model: {used}\n\n{ans}" if ans else "ERROR\n" + "\n".join(errs)
          open("answer.md", "w", encoding="utf-8").write(out)
          print("===ANSWER===\n" + out + "\n===END===")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: answer
          path: answer.md
